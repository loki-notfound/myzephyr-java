# The library uses no AndroidX; the AAR must not pull it into an app.
android.useAndroidX=false
# The library has no Kotlin; AGP 9's built-in Kotlin would otherwise add kotlin-stdlib to the POM.
# AGP 10 removes this option (deprecated in AGP 9): revisit when AGP moves.
android.builtInKotlin=false
org.gradle.jvmargs=-Xmx2g
# Coordinates of the AAR, the same as the Maven build's (pom.xml)
GROUP=io.github.loki-notfound
VERSION_NAME=2.3.0-sec.1-java.1-SNAPSHOT
