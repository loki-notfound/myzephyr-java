# The library uses no AndroidX; the AAR must not pull it into an app.
android.useAndroidX=false
# The library has no Kotlin; AGP 9's built-in Kotlin would otherwise add kotlin-stdlib to the POM.
# AGP 10 removes this option (deprecated in AGP 9): revisit when AGP moves.
android.builtInKotlin=false
org.gradle.jvmargs=-Xmx2g
# Coordinates of the AAR: the group and version of the Maven build (pom.xml); its own artifactId,
# since one Maven coordinate holds one POM and the JAR's differs (QUESTIONS R12-3)
GROUP=io.github.loki-notfound
ARTIFACT_ID=zephyr-java-android
VERSION_NAME=2.3.0-sec.2-java.1
# Reproducible release builds: no build cache, every output is produced by this build
org.gradle.caching=false
