# zephyr-java CI: the Java build with its pure tests, the native matrix through zephyr's depends,
# and the release package with the build manifest.
# NOT RUN YET: written in round 11 (2026-11-07); the first run is after the first push (R14).
# Every job calls the repository's own scripts, the same ones F-Droid and a local release run.
name: build

on:
  - push
  - pull_request

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    # the developer build (bin/build_libzephyr_java.sh) against the distribution's libraries,
    # then the pure test suites (mvn test, 30 tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: System libraries of the developer build
        # the -dev packages whose libraries and headers the developer build found on the round-1
        # build host (Debian 13; derived from its CMake caches with dpkg -S, round 11), with the
        # unversioned boost names, which are 1.83 on Ubuntu 24.04 as on Debian 13
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ccache pkg-config python3 libboost-atomic-dev libboost-chrono-dev libboost-date-time-dev libboost-filesystem-dev libboost-program-options-dev libboost-regex-dev libboost-serialization-dev libboost-system-dev libboost-thread-dev libssl-dev libunbound-dev libsodium-dev libzmq3-dev libpgm-dev libnorm-dev libkrb5-dev libbsd-dev libmd-dev zlib1g-dev libhidapi-dev libusb-1.0-0-dev libudev-dev libprotobuf-dev protobuf-compiler libreadline-dev libncurses-dev
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-java-${{ github.sha }}
          restore-keys: |
            ccache-java-
      - name: Native library against the system libraries
        run: bin/build_libzephyr_java.sh
      - name: Pure tests
        run: mvn -q test

  natives:
    # one release native per platform through zephyr's contrib/depends, stripped, with debug
    # symbols. Every native is built in the pinned debian:12 image with the checkout copied to
    # /work, the same image, path and Debian snapshot as the local verification build
    # (bin/build_linux_container.sh, bin/build_android_container.sh): NDK r18b's clang 7 keeps
    # __FILE__ paths in the Android libraries, so they match only when built at the same path;
    # bin/container-build-deps.sh installs the toolchain packages from one snapshot.debian.org
    # timestamp, so both sides compile with the same packages; the Linux natives get a glibc floor
    # of 2.36 (Debian 12, Ubuntu 23.04 and later, RHEL 10).
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container: docker.io/library/debian:12@sha256:366a6da5efcceffbaa19c560a101b97b87a1a9664eeeac8bc3d24395ddbf14f3
    env:
      ZEPHYR_JAVA_CONTAINER: docker.io/library/debian:12@sha256:366a6da5efcceffbaa19c560a101b97b87a1a9664eeeac8bc3d24395ddbf14f3
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            build: bin/build_linux.sh x86_64
          - platform: linux-arm64
            build: bin/build_linux.sh arm64
          - platform: android-arm64-v8a
            build: bin/build_android.sh arm64-v8a
          - platform: android-armeabi-v7a
            build: bin/build_android.sh armeabi-v7a
          - platform: android-x86_64
            build: bin/build_android.sh x86_64
    steps:
      - uses: actions/checkout@v4
        # the image has no git yet, so this first checkout downloads the files only (REST API),
        # enough to run bin/container-build-deps.sh: nothing is installed from the live mirror
      - name: Debian 12 build packages from the pinned snapshot
        run: bash bin/container-build-deps.sh
      - uses: actions/checkout@v4
        # now with git: the repository and the zephyr-cpp submodule
        with:
          submodules: true
      - name: git and the environment
        # the workspace belongs to the runner's user, the container runs as root
        run: |
          git config --global --add safe.directory "*"
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-$(dpkg --print-architecture)" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        # depends' package cache and downloaded sources; bin/pins.env fixes the zephyr tree and with
        # it every recipe in contrib/depends/packages/, patches/depends/ changes the recipes on
        # top, and bin/container-build-deps.sh fixes the compilers: together they decide the
        # depends packages' hashes
        with:
          path: |
            external/zephyr-cpp/external/zephyr/contrib/depends/built
            external/zephyr-cpp/external/zephyr/contrib/depends/sources
          key: depends-${{ matrix.platform }}-${{ hashFiles('bin/pins.env', 'patches/depends/**', 'bin/container-build-deps.sh') }}
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-
      - name: Build ${{ matrix.platform }} at /work
        # the checkout (with the restored depends cache) is copied to /work and built there; the
        # outputs and the depends cache are copied back for the upload and the cache save
        run: |
          mkdir -p /work
          cp -a "$GITHUB_WORKSPACE"/. /work/
          cd /work
          ${{ matrix.build }}
          bin/strip_natives.sh
          mkdir -p "$GITHUB_WORKSPACE/build"
          for D in natives android debug; do
            if [ -d "build/$D" ]; then
              rm -rf "$GITHUB_WORKSPACE/build/$D"
              cp -a "build/$D" "$GITHUB_WORKSPACE/build/"
            fi
          done
          DEPENDS=external/zephyr-cpp/external/zephyr/contrib/depends
          mkdir -p "$GITHUB_WORKSPACE/$DEPENDS"
          rm -rf "$GITHUB_WORKSPACE/$DEPENDS/built" "$GITHUB_WORKSPACE/$DEPENDS/sources"
          cp -a "$DEPENDS/built" "$DEPENDS/sources" "$GITHUB_WORKSPACE/$DEPENDS/"
      - uses: actions/upload-artifact@v4
        # paths relative to build/: natives/ (with build-env for the manifest), android/, debug/
        with:
          name: natives-${{ matrix.platform }}
          path: |
            build/natives/**
            build/android/**
            build/debug/**
          if-no-files-found: error

  package:
    # bin/package_release.sh, the same packaging script bin/build_release.sh calls, so the CI
    # release and a local release cannot drift: the JAR (Linux natives, tests on the
    # depends-built x86_64 library), sources and Javadoc jars, the AAR (Android natives) with its
    # sources jar and POM, the debug symbols, the Maven repository, the site, the manifest and
    # SHA256SUMS in dist/<version>/
    needs: natives
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          merge-multiple: true
          path: build
      - name: Android SDK platform and build-tools of the AAR build
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: dist/<version>/ (bin/package_release.sh)
        # the natives jobs' artifacts are in build/natives/, build/android/, build/debug/; the
        # script checks the versions first (bin/check_versions.sh)
        run: bin/package_release.sh "$(sed -n 's/^VERSION_NAME=//p' android/gradle.properties)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
